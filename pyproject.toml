[project]
name = "fitness-dashboard"
version = "0.1.0"
description = "A Streamlit fitness dashboard backed by SQLite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.3,<3.0",
    "streamlit>=1.49,<2.0",
    "streamlit-echarts>=0.7.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4.25,<5.0",
    "pyflakes>=3.4.0",
    "pytest>=8.4,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
